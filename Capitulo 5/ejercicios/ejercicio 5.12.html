<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>MDCF - Caja flexible vertical</title>

    <style>
        .contenedor {
            display: flex;
            flex-direction: column;

            width: 300px;
            border: 3px solid black;
            padding: 10px;
        }

        .caja {
            height: 80px;
            margin: 5px;
            border: 2px solid black;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
            font-weight: bold;
        }

        .caja1 {
            background-color: lightblue;
        }

        .caja2 {
            background-color: lightgreen;
        }

        .caja3 {
            background-color: lightcoral;
        }

        .caja4 {
            background-color: lightyellow;
        }
    </style>
</head>

<body>

    <h1>Caja flexible vertical</h1>

    <div class="contenedor">
        <div class="caja caja1">Elemento 1</div>
        <div class="caja caja2">Elemento 2</div>
        <div class="caja caja3">Elemento 3</div>
        <div class="caja caja4">Elemento 4</div>
    </div>
    <p>
        <a href="index.html">
            <button type="button">Volver al índice de ejemplos</button>
        </a>
    </p>
</body>
</html>
