<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Esquinas redondeadas</title>
    <style>
        div {
            width: 100px;
            height: 100px;
            border: 3px solid black;
            margin: 20px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .caja1 {
            border-radius: 10px;
            background-color: lightblue;
        }
        .caja2 {
            border-radius: 50px;
            background-color: lightgreen;
        }
        .caja3 {
            border-radius: 100px;
            background-color: lightcoral;
        }
    </style>
</head>
<body>
    <div class="caja1">
        <strong>10px</strong>
    </div>
    <div class="caja2">
        <strong>50px</strong>
    </div>
    <div class="caja3">
        <strong>100px</strong>
    </div>
    <p>
        <a href="index.html">
            <button type="button">Volver al índice de ejemplos</button>
        </a>
    </p>
</body>
</html>
