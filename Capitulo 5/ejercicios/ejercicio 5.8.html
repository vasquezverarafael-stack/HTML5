<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Animación en patrón cuadrado</title>

    <style>
        .cuadro {
            width: 100px;
            height: 100px;
            background-color: deepskyblue;
            position: relative;

            animation: movimiento 4s linear infinite;
        }

        @keyframes movimiento {
            0% {
                left: 0;
                top: 0;
            }

            25% {
                left: 300px;
                top: 0;
            }

            50% {
                left: 300px;
                top: 300px;
            }

            75% {
                left: 0;
                top: 300px;
            }

            100% {
                left: 0;
                top: 0;
            }
        }
    </style>
</head>

<body>

    <div class="cuadro"></div>
    <p>
        <a href="index.html">
            <button type="button">Volver al índice de ejemplos</button>
        </a>
    </p>
</body>
</html>
