<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Sombras de caja</title>
    <style>
        div {
            width: 200px;
            height: 200px;
            margin: 50px;
        }
        .caja1 {
            background-color: lightblue;
            box-shadow: 15px 15px 20px dimgrey;
        }
        .caja2 {
            background-color: lightgreen;
            box-shadow: -15px -15px 30px dimgrey;
        }
        .caja3 {
            background-color: lightcoral;
            box-shadow: 15px 15px 10px dimgrey;
        }
    </style>
</head>
<body>
    <div class="caja1"></div>
    <div class="caja2"></div>
    <div class="caja3"></div>
    <p>
        <a href="index.html">
            <button type="button">Volver al índice de ejemplos</button>
        </a>
    </p>
</body>
</html>
