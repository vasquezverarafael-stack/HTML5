<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Transformación con Hover</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .galeria {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 50px;
        }

        .galeria img {
            width: 200px;
            height: 150px;
            object-fit: cover;

            transition: transform 0.5s;
        }

        .galeria img:hover {
            transform: scale(1.2);
        }
    </style>
</head>

<body>

    <h1>Transformación de imágenes con :hover</h1>

    <p>Pasa el ratón sobre una imagen.</p>

    <div class="galeria">
        <img src="imagen1.jpg" alt="Imagen 1">
        <img src="imagen2.jpg" alt="Imagen 2">
        <img src="imagen3.jpg" alt="Imagen 3">
        <img src="imagen4.jpg" alt="Imagen 4">
    </div>
    <p>
        <a href="index.html">
            <button type="button">Volver al índice de ejemplos</button>
        </a>
    </p>
</body>
</html>
