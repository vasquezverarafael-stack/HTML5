<!DOCTYPE html>
<!-- Fig. 5.7: trazotexto.html -->
<!-- Trazo de texto en CSS3. -->

<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Trazo de texto</title>
    <style type="text/css">
        h1 {
            color: lightcyan;
            -webkit-text-stroke: 2px black; /* prefijo de proveedor */
            font-size: 500%; /* aumenta el tamaño de la fuente */
        }
    </style>
</head>
<body>
    <h1>Trazo de texto</h1>
    <p>
        <a href="index.html">
            <button type="button">Volver al índice de ejemplos</button>
        </a>
    </p>
</body>
</html>
