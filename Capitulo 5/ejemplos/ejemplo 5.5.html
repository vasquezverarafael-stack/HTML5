<!DOCTYPE html>
<!-- Fig. 5.6: gradienteradial.html -->
<!-- Gradientes radiales en CSS3. -->

<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gradiente radial</title>
    <style type="text/css">
        div {
            width: 200px;
            height: 200px;
            padding: 5px;
            text-align: center;

            background: -webkit-radial-gradient(center, yellow, red);
            background: -moz-radial-gradient(center, yellow, red);
            background: radial-gradient(circle at center, yellow, red);
        }
    </style>
</head>
<body>
    <div>
        <h2>Gradiente radial</h2>
    </div>
    <p>
        <a href="index.html">
            <button type="button">Volver al índice de ejemplos</button>
        </a>
    </p>
</body>
</html>
