<!-- Creación de efectos de sombra de caja. -->

<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Sombra de caja</title>
    <style type="text/css">
        div {
            width: 200px;
            height: 200px;
            background-color: plum;
            box-shadow: 25px 25px 50px dimgrey;
            float: left;
            margin-right: 120px;
            margin-top: 40px;
        }
        #caja2 {
            width: 200px;
            height: 200px;
            background-color: plum;
            box-shadow: -25px -25px 50px dimgrey;
        }
        h2 {text-align: center;}
    </style>
</head>
<body>
    <div>
        <h2>Sombra de caja inferior y derecha</h2>
    </div>
    <div id="caja2">
        <h2>Sombra de caja superior e izquierda</h2>
    </div>
