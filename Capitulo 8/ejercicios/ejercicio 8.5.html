<!DOCTYPE html>

<!-- Ejercicio 8.8: ej08_08.html -->
<!-- Cálculo del interés compuesto para varias tasas de interés. -->
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Ejercicio 8.8 - Interés compuesto con varias tasas</title>
    <style type="text/css">
        body { font-family: Arial, sans-serif; margin: 30px; }
        .instruccion { background-color: #eef3fb; border-left: 4px solid darkblue;
                       padding: 10px 15px; max-width: 800px; }
        table { width: 300px;
                border-collapse: collapse;
                background-color: lightblue;
                margin-bottom: 25px; }
        table, td, th { border: 1px solid black;
                        padding: 4px; }
        th { text-align: left;
             color: white;
             background-color: darkblue; }
        tr.filaimpar { background-color: white; }
    </style>
</head>
<body>
    <h1>Ejercicio 8.8</h1>

    <p class="instruccion">Modifique el programa de interés compuesto de la figura 8.6,
       repitiendo sus pasos para las tasas de interés de 5, 6, 7, 8, 9 y 10 por ciento.
       Use una instrucción for para variar la tasa de interés. Use una tabla separada
       para cada tasa.</p>

    <script>

        var monto; // monto actual de dinero
        var principal = 1000.00; // monto principal
        var tasa; // tasa de interés como decimal (0.05, 0.06, ...)

        // ciclo externo: varía la tasa de interés del 5 al 10 por ciento
        for ( var porcentaje = 5; porcentaje <= 10; ++porcentaje )
        {
            tasa = porcentaje / 100;

            document.writeln( "<table>" ); // comenzar la tabla de esta tasa
            document.writeln(
                "<caption>Interés compuesto al " + porcentaje + "%</caption>" );
            document.writeln(
                "<thead><tr><th>Año</th>" ); // encabezado de la columna del año
            document.writeln(
                "<th>Monto en depósito</th>" ); // encabezado de la columna del monto
            document.writeln( "</tr></thead><tbody>" );

            // ciclo interno: imprimir una fila de la tabla para cada año
            for ( var anio = 1; anio <= 10; ++anio )
            {
                monto = principal * Math.pow( 1.0 + tasa, anio );

                if ( anio % 2 !== 0 )
                    document.writeln( "<tr class='filaimpar'><td>" + anio +
                        "</td><td>" + monto.toFixed(2) + "</td></tr>" );
                else
                    document.writeln( "<tr><td>" + anio +
                        "</td><td>" + monto.toFixed(2) + "</td></tr>" );
            } // fin del for interno

            document.writeln( "</tbody></table>" ); // terminar la tabla
        } // fin del for externo

    </script>

    <p>
        <a href="index.html">
            <button type="button">Volver al índice de ejercicios</button>
        </a>
    </p>
</body>
</html>
