<!DOCTYPE html>

<!-- Fig. 8.1: ContadorWhile.html -->
<!-- Repetición controlada por un contador. -->
<html>
<head>
    <meta charset="utf-8">
    <title>Repetición controlada por contador</title>
    <script>
        var contador = 1; // inicialización

        while ( contador <= 7 ) // condición de repetición
        {
            document.writeln( "<p style = 'font-size: " + contador +
                "ex'>Tamaño de fuente de HTML5 " + contador + "ex</p>" );
            ++contador; // incremento
        } // fin de while
    </script>
</head>
<body>
    <p>
        <a href="index.html">
            <button type="button">Volver al índice de ejemplos</button>
        </a>
    </p>
</body>
</html>
