<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Color y posicionamiento con CSS</title>
    <style>
        .verdeMover {
            color: green;
            position: relative;
            top: 25px;
            left: 15px;
        }
    </style>
</head>
<body>
    <h1>Uso de la clase verdeMover</h1>
        <p class="verdeMover">
            Este texto es de color verde y está desplazado
            25 píxeles hacia abajo y 15 píxeles hacia la derecha.
        </p>
        <p>
            Este texto no utiliza la clase verdeMover y permanece
            en su posición normal.
        </p>
        <p>
            <a href="index.html">
                <button type="button">Volver al índice de ejercicios</button>
            </a>
        </p>
    </body>
</html>
