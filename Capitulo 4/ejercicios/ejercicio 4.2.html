<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Imagen de fondo</title>
    <style>
        body {
            background-image: url("fondo.png");
            background-position: bottom;
            background-repeat: repeat-x;
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h1>Imagen de fondo con CSS</h1>
    <p>
        La imagen de fondo se encuentra en la parte inferior
        de la página y se repite horizontalmente.
    </p>
    <p>
        Además, permanece fija cuando el usuario se desplaza
        hacia arriba o hacia abajo.
    </p>
