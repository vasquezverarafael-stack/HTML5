<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Relleno, borde y margen con CSS</title>
    <style>
        h1, h2 {
            padding: 0.5em;
            border-style: dashed;
            margin: 0.5em;
        }
    </style>
</head>
    <body>
        <h1>Encabezado H1</h1>
        <h2>Encabezado H2</h2>
        <p>
            Los elementos h1 y h2 tienen un relleno de 0.5 em,
            un borde discontinuo (dashed) y un margen de 0.5 em.
        </p>
        <p>
            <a href="index.html">
                <button type="button">Volver al índice de ejercicios</button>
            </a>
        </p>
    </body>
</html>
