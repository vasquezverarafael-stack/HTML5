<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Diseño con elementos flotantes</title>
    <style>
        header {
            background-color: lightblue;
            border: 2px solid blue;
            text-align: center;
            padding: 10px;
        }
        .columna1 {
            float: left;
            width: 45%;
            background-color: lightgreen;
            border: 2px solid green;
            padding: 10px;
        }
        .columna2 {
            float: right;
            width: 45%;
            background-color: lightyellow;
            border: 2px solid orange;
            padding: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Plantilla de diseño con CSS</h1>
    </header>
    <p class="columna1">
        Este es el primer párrafo. Se encuentra alineado
        como una columna en el lado izquierdo de la página.
    </p>
    <p class="columna2">
        Este es el segundo párrafo. Se encuentra alineado
        como una columna en el lado derecho de la página.
    </p>
    <div style="clear: both;"></div>
    <p>
        <a href="index.html">
            <button type="button">Volver al índice de ejercicios</button>
        </a>
    </p>
</body>
</html>
