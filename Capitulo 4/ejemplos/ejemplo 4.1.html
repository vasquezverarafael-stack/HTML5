<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Estilos en l&iacute;nea</title>
    </head>
    <body>
        <p>Este texto no tiene aplicado ning&uacute;n</p>

        <!--El atributo style nos permite declarar-->
        <!--estilos en linea. Debemos separar varias-->
        <!--propiedades con punto y coma.-->
        <p style="font-size: 20px;">Este texto tiene aplicado el estilo
            <em>font-size</em>, para que sea de 20pt.
        </p>

        <p style="font-size: 20px; color:deepskyblue;">
            Este texto tiene aplicado los estilos<em>font-size</em> y 
            <em>color</em>, para que sea de
            20pt y de color azul cielo profundo.</p>
        <p>
            <a href="index.html">
            <button type="button">Volver al índice de ejemplos</button>
            </a>
        </p>
    </body>
</html>
