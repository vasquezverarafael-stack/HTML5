<!-- Ejercicio: Diálogos de alerta en JavaScript -->

<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Diálogos de alerta - JavaScript</title>
</head>

<body>

    <h1>¿Qué aparece en el diálogo de alerta?</h1>

    <p>Suponga que x = 2 y y = 3.</p>

    <p>
        <strong>a)</strong>
        <code>window.alert("x = " + x);</code>
    </p>
    <p><strong>Respuesta:</strong> x = 2</p>

    <p>
        <strong>b)</strong>
        <code>window.alert("El valor de x es " + (x + x));</code>
    </p>
    <p><strong>Respuesta:</strong> El valor de x es 4</p>

    <p>
        <strong>c)</strong>
        <code>window.alert(x);</code>
    </p>
    <p><strong>Respuesta:</strong> 2</p>

    <p>
        <strong>d)</strong>
        <code>window.alert((x + y) + " " + (y + x));</code>
    </p>
    <p><strong>Respuesta:</strong> 5 5</p>

    </p>
</body>
</html>
