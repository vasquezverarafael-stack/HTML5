<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Cuadrados y cubos</title>
    <style>
        table, th, td { border: 1px solid black; border-collapse: collapse; }
        th, td { padding: 4px 12px; text-align: center; }
    </style>
    <script>
        var numero;   // número actual

        document.writeln("<table>");
        document.writeln("<caption>Cuadrados y cubos de 0 a 5</caption>");
        document.writeln("<thead><tr><th>número</th><th>cuadrado</th><th>cubo</th></tr></thead>");
        document.writeln("<tbody>");

        numero = 0;
        document.writeln("<tr><td>" + numero + "</td><td>" + numero * numero +
                         "</td><td>" + numero * numero * numero + "</td></tr>");

        numero = 1;
        document.writeln("<tr><td>" + numero + "</td><td>" + numero * numero +
                         "</td><td>" + numero * numero * numero + "</td></tr>");

        numero = 2;
        document.writeln("<tr><td>" + numero + "</td><td>" + numero * numero +
                         "</td><td>" + numero * numero * numero + "</td></tr>");

        numero = 3;
        document.writeln("<tr><td>" + numero + "</td><td>" + numero * numero +
                         "</td><td>" + numero * numero * numero + "</td></tr>");

        numero = 4;
        document.writeln("<tr><td>" + numero + "</td><td>" + numero * numero +
                         "</td><td>" + numero * numero * numero + "</td></tr>");

        numero = 5;
        document.writeln("<tr><td>" + numero + "</td><td>" + numero * numero +
                         "</td><td>" + numero * numero * numero + "</td></tr>");

        document.writeln("</tbody>");
        document.writeln("</table>");
    </script>
</head>
