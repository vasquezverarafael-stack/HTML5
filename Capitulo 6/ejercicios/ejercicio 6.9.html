<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Números del 1 al 4</title>
</head>
<body>

    <!-- a) Una sola instrucción document.writeln -->
    <p>
        <script>
            document.writeln("1 2 3 4");
        </script>
    </p>

    <!-- b) Cuatro instrucciones document.write -->
    <p>
        <script>
            document.write("1 ");
            document.write("2 ");
            document.write("3 ");
            document.write("4");
        </script>
    </p>
    <p>
        <a href="index.html">
            <button type="button">Volver al índice de ejercicios</button>
        </a>
    </p>

</body>
