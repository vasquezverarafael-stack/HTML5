<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Uso de cuadros prompt y alert</title>

    <script type="text/javascript">

        var nombre; // cadena introducida por el usuario

        // Lee el nombre del cuadro prompt como una cadena
        nombre = window.prompt("Escriba su nombre");

        document.writeln(
            "<h1>Hola " + nombre +
            ", bienvenido a la programación en JavaScript</h1>"
        );

    </script>

</head>

<body>
    <p>
        <a href="index.html">
            <button type="button">Volver al índice de ejemplos</button>
        </a>
    </p>
</body>

</html>
