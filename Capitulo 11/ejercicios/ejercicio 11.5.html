<!-- Ejercicio 11.5: ej11_05.html -->
<!-- Redondeo de números con Math.round. -->
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Ejercicio 11.5 - Redondeo con round</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .instruccion { background-color: #eef3fb; border-left: 4px solid darkblue;
                       padding: 10px 15px; max-width: 850px; }
        code { background-color: #f4f4f4; padding: 1px 4px; }
        table { border-collapse: collapse; margin-top: 15px; background-color: lightblue; }
        table, th, td { border: 1px solid black; padding: 4px 12px; text-align: right; }
        th { color: white; background-color: darkblue; }
        p.error { color: red; }
    </style>
    <script>

        var filas = ""; // filas acumuladas de la tabla

        // a) redondea al entero más cercano
        function redondearAEntero( numero )
        {
            return Math.round( numero );
        } // fin de la función redondearAEntero

        // b) redondea a la décima más cercana
        function redondearADecimas( numero )
        {
            return Math.round( numero * 10 ) / 10;
        } // fin de la función redondearADecimas

        // c) redondea a la centésima más cercana
        function redondearACentesimas( numero )
        {
            return Math.round( numero * 100 ) / 100;
        } // fin de la función redondearACentesimas

        // d) redondea a la milésima más cercana
        function redondearAMilesimas( numero )
        {
            return Math.round( numero * 1000 ) / 1000;
        } // fin de la función redondearAMilesimas

        // leer un valor, redondearlo y agregar una fila a la tabla
        function agregarValor()
        {
            var campo = document.getElementById( "campoNumero" );
            var numero = parseFloat( campo.value );

            if ( isNaN( numero ) )
            {
                document.getElementById( "mensaje" ).innerHTML =
                    "<p class='error'>Escriba un número.</p>";
            } // fin de if
            else
            {
                document.getElementById( "mensaje" ).innerHTML = "";

                filas += "<tr><td>" + numero + "</td><td>" + redondearAEntero( numero ) +
                    "</td><td>" + redondearADecimas( numero ) +
                    "</td><td>" + redondearACentesimas( numero ) +
                    "</td><td>" + redondearAMilesimas( numero ) + "</td></tr>";

                document.getElementById( "resultados" ).innerHTML =
                    "<table><caption>Valores redondeados</caption><thead><tr>" +
                    "<th>Valor original</th><th>Entero</th><th>Décima</th>" +
                    "<th>Centésima</th><th>Milésima</th></tr></thead><tbody>" +
                    filas + "</tbody></table>";
            } // fin de else

            campo.value = "";
            campo.focus();
        } // fin de la función agregarValor

        // registrar el manejador de eventos del botón
        function iniciar()
        {
            document.getElementById( "botonRedondear" ).addEventListener( "click", agregarValor, false );
        } // fin de la función iniciar

        window.addEventListener( "load", iniciar, false );

    </script>
</head>
<body>
    <h1>Ejercicio 11.5</h1>

    <p class="instruccion">Modifique la solución al ejercicio 11.4 para usar el método
       <code>round</code> de <code>Math</code> en vez del método <code>floor</code>.</p>

    <form action = "#">
        <p><label>Escriba un número:
            <input id = "campoNumero" type = "text" size = "12"></label>
            <input id = "botonRedondear" type = "button" value = "Redondear"></p>
    </form>

    <div id = "mensaje"></div>
    <div id = "resultados"></div>

    <p>
        <a href="Index.html">
            <button type="button">Volver a la lista de ejercicios</button>
        </a>
    </p>
</body>
</html>
