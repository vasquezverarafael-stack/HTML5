<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11.20 - Mi propio lastIndexOf</title>
</head>
<body>

    <h1>Mi propia versión de lastIndexOf()</h1>

    <form id="formulario">
        <label for="texto">Ingrese una cadena de texto:</label>
        <br>
        <input type="text" id="texto" required>

        <br><br>

        <label for="buscar">Ingrese el texto que desea buscar:</label>
        <br>
        <input type="text" id="buscar" required>

        <br><br>

        <button type="submit">Buscar última aparición</button>
    </form>

    <h3>Resultado:</h3>
    <p id="resultado"></p>

    <script>

        // Crear nuestra propia función lastIndexOf
        function miLastIndexOf(texto, busqueda) {

            // Recorrer la cadena desde el final
            for (let i = texto.length - busqueda.length; i >= 0; i--) {

                let encontrado = true;

                // Comparar los caracteres
                for (let j = 0; j < busqueda.length; j++) {

                    if (texto[i + j] !== busqueda[j]) {
                        encontrado = false;
                        break;
                    }
                }

                // Si se encontró, devolver la posición
                if (encontrado) {
                    return i;
                }
            }

            // Si no se encontró, devolver -1
            return -1;
        }

        // Utilizar la función
        document.getElementById("formulario").addEventListener("submit",
            function(event) {

                event.preventDefault();

                let texto = document.getElementById("texto").value;
                let busqueda = document.getElementById("buscar").value;

                let posicion = miLastIndexOf(texto, busqueda);

                if (posicion !== -1) {
                    document.getElementById("resultado").textContent =
                        "La última aparición se encuentra en la posición: " +
                        posicion;
                } else {
                    document.getElementById("resultado").textContent =
                        "El texto no fue encontrado.";
                }
            }
        );

    </script>
    <p>
        <a href="Index.html">
            <button type="button">Volver a la lista de ejercicios</button>
        </a>
    </p>
</body>
</html>
