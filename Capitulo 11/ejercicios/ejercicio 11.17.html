<!DOCTYPE html>
<!--Vásquez Vera Rafael 227O01115-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11.17 - Código de Carácter</title>
</head>
<body>

    <h1>Convertir código entero a carácter</h1>

    <form id="formulario">
        <label for="codigo">Ingrese un código entero:</label>
        <input type="number" id="codigo" step="1" required>

        <br><br>

        <button type="submit">Mostrar carácter</button>
    </form>

    <h3>Carácter correspondiente:</h3>
    <p id="resultado"></p>

    <script>
        document.getElementById("formulario").addEventListener("submit",
            function(event) {

                // Evitar que se recargue la página
                event.preventDefault();

                // Obtener el código entero
                let codigo = Number(document.getElementById("codigo").value);

                // Validar que sea un número entero
                if (!Number.isInteger(codigo) || codigo < 0 || codigo > 65535) {
                    document.getElementById("resultado").textContent =
                        "Ingrese un código entero entre 0 y 65535.";
                    return;
                }

                // Convertir el código a carácter
                let caracter = String.fromCharCode(codigo);

                // Mostrar el resultado
                document.getElementById("resultado").textContent =
                    "El carácter correspondiente al código " +
                    codigo + " es: " + caracter;
            }
        );
    </script>
   <p>
        <a href="Index.html">
            <button type="button">Volver a la lista de ejercicios</button>
        </a>
    </p>
</body>
</html>
