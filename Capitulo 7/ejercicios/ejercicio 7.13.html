<!-- Ejercicio 7.21: Ciclo infinito -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Ejercicio 7.21 - Potencias de 2</title>
</head>
<body>
    <h1>Potencias de 2</h1>
    <script>
        var numero = 2;

        for (var contador = 1; contador <= 20; contador++) {
            document.writeln(numero + "<br>");
            numero = numero * 2;
        }

        document.writeln("<p>Fin de la prueba limitada.</p>");
    </script>
    <p>
        <a href="index.html">
            <button type="button">Volver al índice de ejercicios</button>
        </a>
    </p>
</body>
</html>
