<!-- Fig. 7.14: incremento.html -->
<!-- Preincremento y postincremento. -->
<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Preincremento y postincremento</title>

    <script type="text/javascript">

        var c;
        c = 5;

        document.writeln("<h3>Postincremento</h3>");

        document.writeln("<p>" + c); 
        // Imprime 5 y luego incrementa

        document.writeln(" " + c++);
        // Imprime 5

        document.writeln(" " + c + "</p>");
        // Imprime 6

        c = 5;

        document.writeln("<h3>Preincremento</h3>");

        document.writeln("<p>" + c);
        // Imprime 5

        document.writeln(" " + ++c);
        // Incrementa y luego imprime 6

        document.writeln(" " + c + "</p>");
        // Imprime 6

    </script>
</head>

<body>
    <p>
        <a href="index.html">
            <button type="button">Volver al índice de ejemplos</button>
        </a>
    </p>
</body>

</html>
