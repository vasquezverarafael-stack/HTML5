<!DOCTYPE html>
<!--Fig 3.1: nuevostiposinputformularios.html-->
<!--Los nuevos tipos der elementos input de formularios de HTML5 y sus atributos-->
<html>
    <head>
        <meta charset="utf-8">
        <title>Nuevos tipos de input de HTML5</title>
    </head>
    
    <body>
        <h1>Demo de nuevos tipos de input HTML5</h1>
        <p>Este formulario demuestra los nuevos tipos de elemntos input de HTML5
            y los atributos placeholder, requerid y autofocus.
        </p>
        <form method = "post" action = "https://deitel.com">
            <p>
                <label>Color:
                    <input type = "color" autofocus />
                    (C&oacute;digo hexadecimal como #ADO8E6)
                </label>
            </p>
            <p>
                <label>Fecha:
                    <input type = "date" />
                    (aaaa-mm-dd, como 2026-09-09)
                </label>
            </p>
            <p>
                <label>Hora y Fecha:
                    <input type = "datetime" />
                    (aaaa-mm-ddThh:mm+ff:gg, como 2026-09-09T03:15)
                </label>
            </p>
            <p>
                <label>Hora y Fecha Local:
                    <input type = "datetime-local" />
                    (aaaa-mm-ddThh:mm, como 2026-09-09T03:15)
                </label>
            </p>
            <p>
                <label>Email:
                    <input type = "email" placeholder = "vasquezverarafael@gmail.com" 
                    required /> (nombre@dominio.com)
                </label>
            </p>
            <p>
                <label>Mes:
                    <input type = "month" />
                    (aaaa-mm, como 2026-09)
                </label>
            </p>
            <p>
                <label>N&uacute;mero:
                    <input type = "number" 
                    min = "1" 
                    max = "10" 
                    step = "1"
                    value = "4" />
                </label>(Escriba un n&uacute;mero entre 1 y 10)
            </p>    
            <p>
                <label>Rango:
                    0 <input type = "range"
                    min = "0"
                    max = "20"
                    value = "10" /> 20
                </label>
            </p>
            <p>
                <label>Tel:
                    <input type="tel"
                    placeholder="(###) ###-####"
                    pattern="\(\d{3}\) +\d{3}-\d{4}"
                    required>
                    (###) ###-####
                </label>
            </p>
            <p>
                <label>Hora:
                    <input type="time">
                    (hh:mm)
                </label>
            </p>
            <p>
                <label>URL:
                    <input type="url"
                    placeholder="http://www.nombredominio.com">
                    (http://www.nombredominio.com)
                </label>
            </p>
            <p>
                <label>Semana:
                    <input type="week">
                    (aaaa-Wnn, tal como 2012-W01)
                </label>
            </p>
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Borrar">
            </p>
        </form>
    </body>
</html>
