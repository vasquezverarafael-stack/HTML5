<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Formulario de registro Web</title>
</head>

<body>

    <h1>Formulario de registro Web</h1>

    <form>

        <p>
            <label>
                Primer nombre:
                <input type="text" name="nombre" required>
            </label>
        </p>

        <p>
            <label>
                Apellido:
                <input type="text" name="apellido" required>
            </label>
        </p>

        <p>
            <label>
                Correo electrónico:
                <input type="email" name="correo" required>
            </label>
        </p>

        <details>

            <summary>Encuesta opcional</summary>

            <p>
                ¿En qué año se encuentra actualmente en la universidad?
            </p>

            <p>
                <label>
                    <input type="radio" name="anio" value="primero">
                    Primer año
                </label>
            </p>

            <p>
                <label>
                    <input type="radio" name="anio" value="segundo">
                    Segundo año
                </label>
            </p>

            <p>
                <label>
                    <input type="radio" name="anio" value="tercero">
                    Tercer año
                </label>
            </p>

            <p>
                <label>
                    <input type="radio" name="anio" value="cuarto">
                    Cuarto año
                </label>
            </p>

            <p>
                <label>
                    <input type="radio" name="anio" value="otro">
                    Otro
                </label>
            </p>

        </details>

        <br>

        <p>
            <input type="submit" value="Registrar">
            <input type="reset" value="Borrar">
        </p>

    </form>

    <br>

    <p>
        <a href="index.html">
            <button type="button">Volver al índice de ejercicios</button>
        </a>
    </p>

</body>

</html>
